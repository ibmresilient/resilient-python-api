[build-system]
requires = ["setuptools ~= 81.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient_sdk"
version = "51.0.9.1"
description = "Python SDK for developing Apps for IBM SOAR"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{name = "IBM SOAR"}]
requires-python = ">=3.11"
keywords = ["ibm", "soar", "resilient", "resilient-circuits", "circuits", "resilient-sdk", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Our libraries
    "resilient >= 51.0.9.0",

    # 3rd party dependencies
    "build     ~= 1.6",
    "genson    ~= 1.3",
    "packaging ~= 25.0",
    "jinja2    ~= 3.1",
]

[project.urls]
Homepage = "https://github.com/ibmresilient/resilient-python-api/tree/main/resilient-sdk"
Documentation = "https://ibm.biz/soar-python-docs"
"IBM Community" = "https://ibm.biz/soarcommunity"
"Change Log" = "https://ibm.biz/resilient-sdk-changes"

[project.scripts]
resilient-sdk = "resilient_sdk.app:main"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
resilient_sdk = [
    "data/**/*",
    "data/validate/.pylintrc",
]
